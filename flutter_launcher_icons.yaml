flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sidema_logo.png"
  min_sdk_android: 21
  
  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sidema_logo.png"
  adaptive_icon_foreground_inset: 16
  
  # iOS
  remove_alpha_ios: true
  
  # Web
  web:
    generate: true
    image_path: "assets/images/sidema_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#1976D2"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/images/sidema_logo.png"
    icon_size: 48
  
  # macOS
  macos:
    generate: true
    image_path: "assets/images/sidema_logo.png"
